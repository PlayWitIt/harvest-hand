plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// The scripted self-test is for development only.
jar {
	exclude 'com/greysworkshop/harvesthand/SelfTest*'
	exclude 'com/greysworkshop/harvesthand/FarmTest*'
	exclude 'com/greysworkshop/harvesthand/KickTest*'
}

loom {
	runs {
		selfTest {
			client()
			name = "Self Test"
			vmArgs "-Dharvesthand.selftest=true", "-Dharvesthand.debug=true", "-Xmx1536m"
			runDir "run"
		}
		// Kicked and the server restarting, on a real server: ./gradlew runKickTest (run it with scripts/kicktest.sh, which runs a local server).
		kickTest {
			client()
			name = "Kick Test"
			vmArgs "-Dharvesthand.kicktest=true", "-Dharvesthand.debug=true", "-Xmx1280m"
			programArgs "--quickPlayMultiplayer", "localhost:25601", "--username", "HhKick"
			runDir "run-kick"
		}
		farmTest {
			client()
			name = "Farm Test"
			vmArgs "-Dharvesthand.farmtest=true", "-Dharvesthand.debug=true", "-Xmx1536m"
			runDir "run"
		}
	}
}
